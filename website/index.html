<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Potions - Claude Code Skills</title>
  <meta name="description" content="Production rules for LLMs. Skills that encode how to do things, not just what to do.">

  <!-- Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/potions.css">
  <link rel="stylesheet" href="styles/animations.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
</head>
<body>
  <!-- Ambient Audio -->
  <audio id="ambient" loop>
    <source src="audio/ambient-cave.mp3" type="audio/mpeg">
  </audio>
  <audio id="bubble" loop>
    <source src="audio/bubble.mp3" type="audio/mpeg">
  </audio>

  <!-- Mystical ambient glow effects -->
  <div class="ambient-glow purple-1"></div>
  <div class="ambient-glow purple-2"></div>
  <div class="ambient-glow blue"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🧪</span>
        <h1>Skill Potions</h1>
      </div>
      <div class="header-actions">
        <button class="sound-toggle" id="soundToggle" title="Toggle Sound">
          <span class="sound-on">🔊</span>
          <span class="sound-off" style="display:none">🔇</span>
        </button>
        <a href="https://github.com/ElliotJLT/Claude-Skill-Potions" target="_blank" class="github-link" title="View on GitHub">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- Tagline -->
    <p class="tagline">Production rules for LLMs. Click potions to collect, then download.</p>

    <!-- Filter Tabs -->
    <nav class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="planning">Planning</button>
      <button class="filter-btn" data-filter="quality">Quality</button>
      <button class="filter-btn" data-filter="data">Data</button>
      <button class="filter-btn" data-filter="debug">Debug</button>
      <button class="filter-btn" data-filter="discipline">Discipline</button>
      <button class="filter-btn" data-filter="productivity">Productivity</button>
      <button class="filter-btn" data-filter="elixir">Elixirs</button>
      <button class="filter-btn" data-filter="fun">Fun</button>
    </nav>

    <!-- Potion Shelves -->
    <main class="shop">
      <div class="shelf-container">
        <!-- Shelves will be generated by JS -->
        <div id="potionGrid" class="potion-grid">
          <!-- Potions injected here -->
        </div>
      </div>
    </main>

    <!-- Download Bar -->
    <footer class="download-bar">
      <div class="selection-info">
        <span id="selectionCount">0</span> potions selected
      </div>
      <button class="download-btn" id="downloadBtn" disabled>
        <span>Download Selected</span>
        <span class="download-icon">📥</span>
      </button>
      <button class="clear-btn" id="clearBtn" style="display:none">Clear</button>
    </footer>
  </div>

  <!-- Email Modal -->
  <div class="modal-overlay" id="emailModal">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-icon">📧</div>
      <h2>Get notified of new potions?</h2>
      <p>Join the list. No spam, just new skills.</p>
      <form id="emailForm">
        <input type="email" id="emailInput" placeholder="wizard@example.com" required>
        <button type="submit" class="modal-btn primary">Download & Subscribe</button>
      </form>
      <button class="modal-btn secondary" id="skipEmail">Just Download</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span class="toast-icon">✅</span>
    <span class="toast-message">Copied to clipboard!</span>
  </div>

  <script src="scripts/app.js" type="module"></script>
</body>
</html>
